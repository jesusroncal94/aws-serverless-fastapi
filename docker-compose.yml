services:
  api:
    build:
      context: .
      target: dev
    command: ["uv", "run", "uvicorn", "shortener.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TABLE_NAME: links
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      BASE_URL: ${BASE_URL:-http://localhost:8000}
    depends_on:
      table-setup:
        condition: service_completed_successfully

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  table-setup:
    image: amazon/aws-cli:2.17.0
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name links \
          --attribute-definitions AttributeName=code,AttributeType=S \
          --key-schema AttributeName=code,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST >/dev/null 2>&1 || true
    depends_on:
      - dynamodb

  tests:
    build:
      context: .
      target: dev
    profiles: ["test"]
